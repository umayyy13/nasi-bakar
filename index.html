<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Nasi Bakar</title>
  <!-- Menghubungkan file CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🔥 Nasi Bakar Special 🔥</h1>
    <p>Pilih menu favoritmu dan pesan langsung via WhatsApp!</p>
  </header>

  <!-- Daftar Produk -->
  <div class="grid" id="product-list"></div>

  <!-- Form Checkout -->
  <div class="checkout-section">
    <h3>Data Pemesanan</h3>
    <div class="form-group" style="margin-top: 10px;">
      <label for="nama">Nama Pemesan</label>
      <input type="text" id="nama" placeholder="Masukkan nama kamu">
    </div>
    <div class="form-group">
      <label for="catatan">Alamat Pengiriman / Catatan</label>
      <textarea id="catatan" rows="3" placeholder="Contoh: Pedas sedang, antar ke Jl. Dago No. 10"></textarea>
    </div>

    <div class="total-box">
      Total: Rp<span id="grand-total">0</span>
    </div>

    <button class="btn-wa" onclick="sendToWA()"> Kirim Pesanan via WhatsApp</button>
  </div>

  <!-- Menghubungkan file JavaScript -->
  <script src="script.js"></script>
</body>
</html>
