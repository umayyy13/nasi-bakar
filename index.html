<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Nasi Bakar</title>
  
  <!-- 1. Preconnect ke Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- 2. Muat Font Playwrite AU SA Guides dan Poppins (untuk teks biasa) -->
  <link href="https://fonts.googleapis.com/css2?family=Playwrite+AU+SA+Guides:ital@0;1&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>BEKALKOS_ID</h1>
  </header>

  <main class="container">
    <!-- Daftar Produk -->
    <div class="grid" id="product-list"></div>

    <!-- Form Checkout -->
    <div class="checkout-section">
      <h3> Data Pemesanan</h3>
      <div class="form-group">
        <label for="nama">Nama Pemesan</label>
        <input type="text" id="nama" placeholder="Masukkan nama kamu">
      </div>
      <div class="form-group">
        <label for="catatan">Alamat Pengiriman / Catatan</label>
        <textarea id="catatan" rows="3" placeholder="Contoh: Pedas sedang, antar ke Jl. Dago No. 10"></textarea>
      </div>

      <div class="total-box">
        <span>Total Bayar:</span>
        <strong>Rp<span id="grand-total">0</span></strong>
      </div>

      <button class="btn-wa" onclick="sendToWA()">📲 Kirim Pesanan via WhatsApp</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
